<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console della seduta</title>
<meta name="description" content="Gli otto slider del dispositivo di negoziazione: quattro azioni di Homo sapiens, quattro comportamenti di Canis lupus. Si usa insieme alla tavola (index.html).">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/console.css">
</head>
<body>
  <div id="app" class="app-console">
    <header id="top">
      <div class="title">
        <h1>Console della seduta</h1>
        <span class="sub">Gli slider muovono la tavola aperta in <b>index.html</b></span>
        <span id="collegamento" class="collegamento assente">in attesa della tavola</span>
      </div>
      <div class="buttons">
        <button id="btn-reset" type="button" title="tasto R">reset</button>
      </div>
    </header>

    <section id="console" aria-label="Console degli slider"></section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/link.js"></script>
  <script src="js/console.js"></script>
</body>
</html>
